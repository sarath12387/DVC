# docker-compose.yml — M4: deployment target (Docker Compose)
# CD flow: on main-branch changes, CI pushes a new image and the deploy job
# runs `docker compose pull && docker compose up -d` to update this service.
services:
  inference:
    image: ${DOCKER_IMAGE:-YOUR_DOCKERHUB_USERNAME/cats-dogs-api:latest}
    container_name: cats-dogs-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/model.pt
    restart: unless-stopped
